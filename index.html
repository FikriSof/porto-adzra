<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Portfolio</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://kit.fontawesome.com/ba702b9129.js" crossorigin="anonymous"></script>
    <!-- Load config FIRST so the rest of the page can read it -->
    <script src="config.js"></script>
  </head>
  <body>

    <!-- ── HERO ────────────────────────────────────────────── -->
    <div id="header">
      <div class="container">
        <nav>
          <h1 id="nav-short-name"></h1>
          <ul id="sidemenu">
            <li><a href="#header">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#portfolio">Portfolio</a></li>
            <i class="fas fa-times" onclick="closemenu()"></i>
          </ul>
          <i class="fas fa-bars" onclick="openmenu()"></i>
        </nav>
        <div class="header-text">
          <h1>Hi!</h1>
          <h1 class="red safira-march">
            I'm <span id="hero-name"></span>
          </h1>
          <p class="green" id="hero-desc"></p>
          <a id="btn-cv" class="btn-cv" download style="display:none">Download CV</a>
        </div>
      </div>
    </div>

    <!-- ── ABOUT ────────────────────────────────────────────── -->
    <div id="about">
      <div class="aboutme" id="about-images-container">
        <!-- about images injected by JS -->
        <div class="tab-titles" id="tab-titles-container">
          <!-- tab labels injected by JS -->
        </div>
        <!-- tab content panels injected by JS -->
      </div>
    </div>

    <!-- ── PORTFOLIO ─────────────────────────────────────────── -->
    <div id="portfolio">
      <img id="journey-img" class="fit" />
      <div class="container">
        <img id="certif-title-img" class="title" />
        <div class="certif-list" id="certif-list">
          <!-- certif images injected by JS -->
        </div>
      </div>
      <img id="portfolio-title-img" class="title" />
      <div id="portfolio-sections">
        <!-- portfolio sections injected by JS -->
      </div>
      <img id="end-img" class="title" />
    </div>

    <!-- ── FOOTER ─────────────────────────────────────────────── -->
    <div class="copyright">
      <p id="copyright-text"></p>
    </div>

    <!-- ── SCRIPTS ───────────────────────────────────────────── -->
    <script>
      /* --------------------------------------------------------
         Apply theme colors from CONFIG
      -------------------------------------------------------- */
      (function applyTheme() {
        const root = document.documentElement;
        root.style.setProperty("--color-primary",   CONFIG.colors.primary);
        root.style.setProperty("--color-secondary", CONFIG.colors.secondary);
        root.style.setProperty("--color-bg",        CONFIG.colors.background);
        root.style.setProperty("--color-nav-bg",    CONFIG.colors.navBg);
      })();

      /* --------------------------------------------------------
         Helper: set background images via CSS var
      -------------------------------------------------------- */
      (function applyBackgrounds() {
        const style = document.createElement("style");
        style.textContent = `
          #header {
            background-image: url('${CONFIG.backgroundImage}');
          }
          @media only screen and (max-width: 600px) {
            #header {
              background-image: url('${CONFIG.backgroundImageMobile}');
            }
          }
        `;
        document.head.appendChild(style);
      })();

      /* --------------------------------------------------------
         Hero section
      -------------------------------------------------------- */
      document.getElementById("nav-short-name").textContent = CONFIG.shortName;
      document.getElementById("hero-name").textContent      = CONFIG.name;
      document.getElementById("hero-desc").innerHTML =
        `<span>${CONFIG.tagline}</span> ${CONFIG.description}`;

      if (CONFIG.cvFile) {
        const btn = document.getElementById("btn-cv");
        btn.href         = CONFIG.cvFile;
        btn.style.display = "inline-block";
      }

      /* --------------------------------------------------------
         About — images
      -------------------------------------------------------- */
      const aboutContainer = document.getElementById("about-images-container");
      CONFIG.aboutImages.forEach(function(src) {
        const img = document.createElement("img");
        img.src       = src;
        img.className = "fit";
        // Insert before tab-titles
        aboutContainer.insertBefore(img, document.getElementById("tab-titles-container"));
      });

      /* --------------------------------------------------------
         About — skill tabs
      -------------------------------------------------------- */
      const tabTitles  = document.getElementById("tab-titles-container");
      const tabPanels  = [];

      CONFIG.skills.forEach(function(skill, index) {
        // Tab label
        const p = document.createElement("p");
        p.className   = "tab-links" + (index === 0 ? " active-link" : "");
        p.textContent = skill.label;
        p.setAttribute("onclick", `opentab('${skill.id}')`);
        tabTitles.appendChild(p);

        // Tab content panel
        const div = document.createElement("div");
        div.className = "tab-contents" + (index === 0 ? " active-tab" : "");
        div.id        = skill.id;
        const img     = document.createElement("img");
        img.src       = skill.image;
        img.className = "skills";
        div.appendChild(img);
        aboutContainer.appendChild(div);
        tabPanels.push(div);
      });

      /* --------------------------------------------------------
         Portfolio — journey banner
      -------------------------------------------------------- */
      document.getElementById("journey-img").src         = CONFIG.journeyImage;
      document.getElementById("certif-title-img").src    = CONFIG.certifTitleImage;
      document.getElementById("portfolio-title-img").src = CONFIG.portfolioTitleImage;
      document.getElementById("end-img").src             = CONFIG.endImage;

      /* --------------------------------------------------------
         Portfolio — certificates grid
      -------------------------------------------------------- */
      const certifList = document.getElementById("certif-list");
      CONFIG.certifImages.forEach(function(src) {
        const figure = document.createElement("figure");
        figure.className = "certif-item";
        const img = document.createElement("img");
        img.src       = src;
        img.className = "certif-img";
        figure.appendChild(img);
        certifList.appendChild(figure);
      });

      /* --------------------------------------------------------
         Portfolio — sections
      -------------------------------------------------------- */
      const sectionsContainer = document.getElementById("portfolio-sections");
      CONFIG.portfolioSections.forEach(function(section) {
        // Section title image (banner)
        const titleImg = document.createElement("img");
        titleImg.src       = section.titleImage;
        titleImg.className = "title";
        sectionsContainer.appendChild(titleImg);

        // Section items
        section.items.forEach(function(item) {
          const img     = document.createElement("img");
          img.src       = item.src;
          img.className = item.isTitle ? "title" : "fit";
          sectionsContainer.appendChild(img);
        });
      });

      /* --------------------------------------------------------
         Footer
      -------------------------------------------------------- */
      document.getElementById("copyright-text").textContent = CONFIG.copyright;

      /* --------------------------------------------------------
         Tab switching
      -------------------------------------------------------- */
      var tablinks   = document.getElementsByClassName("tab-links");
      var tabcontents = document.getElementsByClassName("tab-contents");

      function opentab(tabname) {
        for (var tablink of tablinks) {
          tablink.classList.remove("active-link");
        }
        for (var tabcontent of tabcontents) {
          tabcontent.classList.remove("active-tab");
        }
        event.currentTarget.classList.add("active-link");
        document.getElementById(tabname).classList.add("active-tab");
      }

      /* --------------------------------------------------------
         Mobile nav
      -------------------------------------------------------- */
      var sidemenu = document.getElementById("sidemenu");
      function openmenu() { sidemenu.style.right = "0"; }
      function closemenu() { sidemenu.style.right = "-200px"; }
    </script>
  </body>
</html>
